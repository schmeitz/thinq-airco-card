name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version in card matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          grep -q "const LG_VERSION = '${TAG}';" dist/thinq-airco-card.js || { echo "LG_VERSION in dist/thinq-airco-card.js is not ${TAG}"; exit 1; }

      - name: Release notes from CHANGELOG
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          awk -v v="$TAG" '$0 ~ "^## "v" " {f=1; next} /^## / && f {exit} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Version ${TAG}" > notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/thinq-airco-card.js --title "$GITHUB_REF_NAME" --notes-file notes.md
